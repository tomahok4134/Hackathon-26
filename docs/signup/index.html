<!DOCTYPE HTML>
<html lang="ja-JP">
  <head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="./stylesheet.css">
    <title>デジタル回覧板</title>
  </head>
  <body>
    <header>
    </header>
    <div class="main">
      <p>名前(姓と名の間は半角スペースで区切ってください。)</p>
      <input>
      <p>性別</p>
      <select>
        <option value="male">男性</option>
        <option value="female">女性</option>
        <option value="other">その他</option>
      </select>
      <p>生年月日</p>
      <input type="date">
      <p>世帯主との関係</p>
      <select>
        <option value="head">世帯主</option>
        <option value="配偶者">配偶者</option>
        <option value="親">親</option>
        <option value="子">子</option>
        <option value="甥/姪">甥/姪</option>
        <option value="孫">孫</option>
        <option value="兄弟">兄弟姉妹</option>
        <option value="従兄弟">従兄弟</option>
        <option value="又従兄弟">又従兄弟</option>
        <option value="叔父/叔母">叔父/叔母</option>
        <option value="祖父母">祖父母</option>
        <option value="大叔父/大叔母">大叔父/大叔母</option>
        <option value="曽祖父母">曽祖父母</option>
        <option value="従甥/従姪">従甥/従姪</option>
        <option value="曾孫">曾孫</option>
        <option value="義親">義親</option>
        <option value="義兄弟">義兄弟</option>
        <option value="婿/嫁">婿/嫁</option>
        <option value="義叔父/義叔母">義叔父/義叔母</option>
        <option value="other">その他</option>
      </select>
      <!--<p>部屋番号</p>
      <input type="text">-->
      <p>自己紹介･コメント</p>
      <textarea></textarea>
      <p>非公開にする情報<p>
      <input type="checkbox" id="username" value="username">
      <label for="username">名前</label>
      <input type="checkbox" id="gender" value="gender">
      <label for="gender">性別</label>
      <input type="checkbox" id="birthdate" value="birthday">
      <label for="birthdate">生年月日</label>
      <input type="checkbox" id="relation" value="relation">
      <label for="relation">世帯主との関係</label>
      <input type="submit" value="上記の内容で登録">
    </div>
  </body>
</html>
